run_name: text_swin_umamba_sdi_stable_isic2018_pubmedbert

data:
  isic_root: /Users/mike/Documents/GRA591/datasets/ISIC17_18/isic2018
  captions_jsonl: /Users/mike/Documents/GRA591/code/TextSwinUMamba/outputs/captions/captions_isic2018.jsonl
  text_features_cache: /Users/mike/Documents/GRA591/code/TextSwinUMamba/cache/text_features_isic2018_neuml_pubmedbert_base_embeddings.pt
  image_size: 256
  num_workers: 4
  image_glob: "*.png"
  mask_template: "{stem}.png"

output:
  base_dir: ./runs
  save_every_n_epochs: 1
  keep_best: true

model:
  pretrained_ckpt: ./checkpoints/pretrained/vmamba_tiny_e292.pth
  num_input_channels: 3
  num_classes: 1
  feat_size: [48, 96, 192, 384, 768]
  drop_path_rate: 0.0
  deep_supervision: true
  sdi:
    enabled: true
    channels: 48
    attention: true
    attention_ratio: 16
    residual: true
    alpha_init: 0.1
  tgcm:
    enabled: true
    k_filters: 4
    kernel_size: 3
    iterative: true
    beta_init: 0.1

text:
  model_name: NeuML/pubmedbert-base-embeddings
  max_length: 64
  pool: mean
  freeze: true

train:
  epochs: 300
  batch_size: 16
  grad_accum_steps: 2
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-2
  scheduler: cosine_annealing
  scheduler_t_max: 50
  scheduler_eta_min: 1.0e-5
  freeze_encoder_epochs: 10
  amp: true
  seed: 42
  max_hours: 11.5
  patience: 50

loss:
  dice_weight: 1.0
  bce_weight: 1.0
  dice_smooth: 1.0
  normalize_deep_supervision: true
  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

eval:
  metrics: [dice, iou]
  val_every_n_epochs: 1
